name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  install:
    name: Install & Prisma generate
    runs-on: ubuntu-latest
    outputs:
      lockfile-hash: ${{ steps.hash.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - id: hash
        run: echo "value=${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: backend
        run: pnpm exec prisma generate

  typecheck:
    name: Typecheck (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend
            dir: backend
          - target: admin-web
            dir: apps/admin-web
          - target: resident-app
            dir: apps/resident-app
          - target: staff-app
            dir: apps/staff-app
          - target: api-client
            dir: packages/api-client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: backend
        run: pnpm exec prisma generate

      - name: Pre-build admin-web (.next/types)
        if: matrix.target == 'admin-web'
        working-directory: ${{ matrix.dir }}
        env:
          NEXT_PUBLIC_API_URL: https://api.societyos.in/v1
        run: pnpm next build --no-lint || true

      - name: Typecheck
        working-directory: ${{ matrix.dir }}
        run: |
          if grep -q '"typecheck"' package.json; then
            pnpm typecheck
          else
            pnpm exec tsc --noEmit
          fi

  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend
            dir: backend
          - target: api-client
            dir: packages/api-client
          - target: resident-app
            dir: apps/resident-app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: backend
        run: pnpm exec prisma generate

      - name: Test
        working-directory: ${{ matrix.dir }}
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci
        run: pnpm test

  lint:
    name: Lint (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend
            dir: backend
          - target: admin-web
            dir: apps/admin-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Lint (if defined)
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f package.json ] && grep -q '"lint"' package.json; then
            pnpm lint
          else
            echo "No lint script in ${{ matrix.dir }} — skipping."
          fi

  build-admin-web:
    name: Build admin-web
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: backend
        run: pnpm exec prisma generate

      - name: Build admin-web
        working-directory: apps/admin-web
        env:
          NEXT_PUBLIC_API_URL: https://api.societyos.in/v1
        run: pnpm build
