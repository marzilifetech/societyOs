# AWS Amplify build spec — admin web app (apps/admin-web).
# Amplify auto-detects this file at the repo root and uses it for every build.
#
# Monorepo: appRoot scopes the build to apps/admin-web. The Amplify build
# container ships Node + npm but NOT pnpm, so preBuild installs it first.
version: 1
applications:
  - appRoot: apps/admin-web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@10.33.2
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
